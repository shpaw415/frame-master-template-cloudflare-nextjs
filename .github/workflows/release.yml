name: GitHub Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          if [ "$VERSION" = "0.0.0" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          NOTES_FILE="release-notes/${TAG}.md"
          ARGS=(--title "$TAG" --target "$GITHUB_SHA")
          if [[ "$VERSION" == *-* ]]; then
            ARGS+=(--prerelease)
          fi
          if [ -s "$NOTES_FILE" ]; then
            gh release create "$TAG" "${ARGS[@]}" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "${ARGS[@]}" --generate-notes
          fi
